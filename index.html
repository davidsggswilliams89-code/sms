<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHTMS Login</title><link rel="stylesheet" href="shared/styles.css"></head>
<body><div class="login"><h1>School of Health & Technology</h1><p class="small">Management System Portal</p>
<label>Email</label><input id="email" type="email" placeholder="name@example.com" autocomplete="email">
<label>Password</label><input id="password" type="password" placeholder="Password" autocomplete="current-password">
<button id="loginBtn" class="btn" style="width:100%">Login to Portal</button>
<button id="resetBtn" style="width:100%;margin-top:10px">Forgot Password?</button>
<p id="message" class="small"></p><p class="small">Your dashboard is selected automatically from your Firebase user role.</p></div>
<script type="module">
import { login, resetPassword } from './shared/auth.js';
const email=document.getElementById('email'), password=document.getElementById('password'), msg=document.getElementById('message');
const show=(t,err=false)=>{msg.textContent=t; msg.style.color=err?'#b42318':'#067647'};
document.getElementById('loginBtn').onclick=async()=>{try{show('Signing in...');await login(email.value.trim(),password.value)}catch(e){show(e.message||'Login failed.',true)}};
document.getElementById('resetBtn').onclick=async()=>{try{await resetPassword(email.value.trim());show('Password reset email sent.')}catch(e){show(e.message||'Could not send reset email.',true)}};
password.addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('loginBtn').click()});
</script></body></html>
